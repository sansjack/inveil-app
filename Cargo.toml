[workspace]
resolver = "2"
members = ["crates/contract", "crates/engine", "crates/inveil"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sansjack/inveil-app"
rust-version = "1.85"

[workspace.dependencies]
contract = { path = "crates/contract" }
engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
ring = "0.17"
base64 = "0.22"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
