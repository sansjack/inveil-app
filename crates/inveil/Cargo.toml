[package]
name = "inveil"
description = "Local data-loss-prevention proxy for AI tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["http2"]
http2 = ["hudsucker/http2", "hyper-rustls/http2"]

[dependencies]
contract.workspace = true
engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ring.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
toml_edit = "0.22"
semver = "1"
regex = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json", "blocking"] }
futures-util = "0.3"
hudsucker = "0.25"
rustls-native-certs = "0.8"
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "tls12"] }
http-body-util = "0.1"
bytes = "1"
time = "0.3"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
zstd = "0.14"
brotli-decompressor = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
indicatif = "0.18.6"
console = "0.16.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
brotli = "9"
rustls-webpki = { version = "0.103", features = ["aws-lc-rs"] }

[lints]
workspace = true
