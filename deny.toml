# Checked by `cargo deny check` in ci.yml and audit.yml.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
# Add an entry here only with a written reason and an expiry date; never to silence a warning permanently.
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # ring and aws-lc-rs (BoringSSL lineage) carry this alongside ISC; it is a permissive attribution licence.
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# The proxy terminates TLS with rustls. A system OpenSSL would add a C dependency whose
# version differs per OS and distro, and a second TLS stack to audit.
deny = [
    { crate = "openssl", reason = "TLS is rustls only" },
    { crate = "openssl-sys", reason = "TLS is rustls only" },
    { crate = "native-tls", reason = "pulls in OpenSSL on Linux; use rustls with native roots" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
